<style>
  :root{--bg:#000;--panel:#050507;--line:rgba(255,255,255,.1);--text:#f2f4f8;--muted:#8d95a5;--cyan:#3fd3f0;--mag:#c84cef;--gold:#ffb347;
    --sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}

  .zn a.zn-b{border:0;background:transparent;color:#fff;font-weight:600;padding-left:0;letter-spacing:.2em}
  @media (max-width:640px){.zn{gap:4px}.zn a{padding:6px 8px;font-size:10px}.zn a.zn-b{display:none}}
  header{flex-wrap:wrap}
  header .tabs{display:flex;gap:6px;flex-wrap:wrap}
  @media (max-width:640px){header{padding-bottom:6px}header .tabs a{padding:6px 9px;font-size:10px}}
  html,body{overflow-x:hidden}
  header .tabs{display:flex;gap:6px}
  header .tabs a{font:inherit;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#cfd6e2;text-decoration:none}

  header .tabs a.soon{opacity:.45;pointer-events:none}
  header .brand{color:#fff}

  @media (max-width:640px){header .brand span{display:none}}
  main{flex:1;display:grid;grid-template-columns:62fr 38fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--line);min-height:0}
  .pane{position:relative;background:var(--panel);overflow:hidden;min-height:0}
  #world{grid-row:1 / span 2}
  canvas{display:block;width:100%;height:100%}
  .tag{position:absolute;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#fff;pointer-events:none}
  .tag.tl{left:12px;top:10px}.tag.tr{right:12px;top:10px;color:#cfd6e2}
  .tag.bl{left:12px;bottom:10px}.tag.br{right:12px;bottom:10px;color:var(--muted)}

  .timer{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:26px;color:#fff}

  .score{position:absolute;right:12px;top:36px;text-align:right;font-family:var(--mono);font-size:12px;line-height:1.7;color:#cfd6e2}

  .meter i{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--mag);transform:translateX(-50%)}
  .meter b{position:absolute;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--cyan);transform:translate(-50%,0);left:50%}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);background:#000;z-index:2}

  }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Dog } from './dog.js';

const TASK = new URLSearchParams(location.search).get('task') || 'tabletennis';
document.querySelectorAll('#tabs a[data-task]').forEach(a => a.classList.toggle('on', a.dataset.task === TASK));
const COMMON_FOOT = ` The scene is rendered at 320×180 and sampled at the positions of 256 light-responsive cells of a linear whole-brain model fitted to one real zebrafish (ZAPBench, one-step R² 0.94). 128 right minus 128 left turning-responsive hindbrain cells are the steering signal; 16 gate cells are the action signal. Success pulses 15 reward cells, failure pulses 2 aversive cells, and the same anti-Hebbian rule as the trading engine changes the light→readout edges. Each light cell is placed on the screen by the side of the readout it drives in the fitted model (a disclosed display adapter, the way the fly's retina map is) and sees a 9×9-pixel patch. Each readout side is z-scored against its own recorded mean and spread (the left group is twice as variable as the right in the recording), then the difference is centred on its own 30-second running average, so the recording's resting left bias does not pin the controls. Nothing is scripted. Model steps at 16 Hz, a compressed clock relative to the ~1 Hz recording.`;

/* ============================ BRAIN MODEL ============================ */
const P = { frozen: false, stepHz: 16, inputGain: 0.6, pulseAmp: 0.5, pulseSteps: 2, thr: 0.02, gateLevel: 0.10, eta: 0.001, frameSeconds: 0.9,
  tracePre: 1.0, traceDan: 1.0, memDecay: 1800, wFilter: 0.05, minFrac: 0.1, maxFrac: 2.0 };
let B = null;
function f16to32(u16) {
  const out = new Float32Array(u16.length);
  for (let i = 0; i < u16.length; i++) {
    const h = u16[i], s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, m = h & 0x3ff;
    out[i] = e === 0 ? s * Math.pow(2, -14) * (m / 1024) : e === 31 ? (m ? NaN : s * Infinity) : s * Math.pow(2, e - 15) * (1 + m / 1024);

}
async function loadBrain() {
  const [meta, buf] = await Promise.all([fetch('data/model.json').then(r => r.json()), fetch('data/model.bin').then(r => r.arrayBuffer())]);
  const M = meta.M, L = meta.lags, u16 = new Uint16Array(buf);
  const A = f16to32(u16.subarray(0, M * L * M)), b = f16to32(u16.subarray(M * L * M, M * L * M + M));
  const lo = f16to32(u16.subarray(M * L * M + M, M * L * M + 2 * M)), hi = f16to32(u16.subarray(M * L * M + 2 * M, M * L * M + 3 * M));
  const pops = {}; for (const k in meta.populations) { const [a, z] = meta.populations[k]; pops[k] = Array.from({ length: z - a }, (_, i) => a + i); }
  const er = [], ec = [], ecomp = [], ebase = [];
  const rows = [...pops.right.map(r => [r, 0]), ...pops.left.map(r => [r, 1])];
  for (const [r, comp] of rows) for (const c of pops.visual) { const v = A[r * L * M + c]; if (Math.abs(v) > 1e-4) { er.push(r); ec.push(c); ecomp.push(comp); ebase.push(v); } }
  const E = er.length;
  B = { M, L, A, b, lo, hi, mean: Float32Array.from(meta.mean), gs: meta.group_stats, pops, uv: meta.uv, gidx: meta.global_index,
    h: new Float32Array(L * M), x: new Float32Array(M), er, ec, ecomp, ebase: Float32Array.from(ebase), E,
    u: new Float32Array(E), w: new Float32Array(E), yPre: new Float32Array(E), yDan: new Float32Array(pops.reward.length + pops.aversive.length), steps: 0, changed: 0 };
}
function brainStep(drive) {
  const { M, L, A, b, h, x } = B;
  for (let e = 0; e < B.E; e++) A[B.er[e] * L * M + B.ec[e]] = B.ebase[e] * (1 + B.w[e]);
  for (let i = 0; i < M; i++) { let s = b[i] + drive[i]; const row = i * L * M; for (let j = 0; j < L * M; j++) s += A[row + j] * h[j]; x[i] = Math.min(B.hi[i], Math.max(B.lo[i], s)); }

}
function ruleAdvance() {
  const dt = P.frameSeconds, ak = Math.exp(-dt / P.tracePre), ad = Math.exp(-dt / P.traceDan), sak = Math.sqrt(ak), sad = Math.sqrt(ad);
  const dan = B.pops.reward.concat(B.pops.aversive), nR = B.pops.reward.length; const danHz = [0, 0], dMid = [0, 0];
  for (let d = 0; d < dan.length; d++) { const hz = Math.max(B.x[dan[d]], 0) * 20, mid = B.yDan[d] * sad + hz * (1 - sad); B.yDan[d] = B.yDan[d] * ad + hz * (1 - ad); const c = d < nR ? 0 : 1, n = c === 0 ? nR : dan.length - nR; danHz[c] += hz / n; dMid[c] += mid / n; }
  if (P.frozen) return;
  const tu = P.memDecay, tw = P.wFilter, eu = Math.exp(-dt / tu), ew = Math.exp(-dt / tw), c = tu / (tu - tw) * (eu - ew), ku = tu * -Math.expm1(-dt / tu), kw = tu * (-Math.expm1(-dt / tw) - c), lo = P.minFrac - 1, hi = P.maxFrac - 1; let changed = 0;
  for (let e = 0; e < B.E; e++) { const preHz = Math.max(B.x[B.ec[e]], 0) * 20, kmid = B.yPre[e] * sak + preHz * (1 - sak); B.yPre[e] = B.yPre[e] * ak + preHz * (1 - ak); const comp = B.ecomp[e], drive = P.eta * (preHz * dMid[comp] - danHz[comp] * kmid), oldU = B.u[e]; B.u[e] = Math.min(hi, Math.max(lo, oldU * eu + drive * ku)); B.w[e] = Math.min(hi, Math.max(lo, B.w[e] * ew + oldU * c + drive * kw)); if (Math.abs(B.w[e]) > 1e-9) changed++; }

/* ============================ RENDERERS / SHARED ============================ */
const glc = document.getElementById('gl');
const R = new THREE.WebGLRenderer({ canvas: glc, antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true;
const S = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
const rt = new THREE.WebGLRenderTarget(320, 180, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter }); const rtPix = new Uint8Array(320 * 180 * 4);
const seesC = document.getElementById('sees'), seesCtx = seesC.getContext('2d'), seesImg = seesCtx.createImageData(320, 180);
const seesTmp = document.createElement('canvas'); seesTmp.width = 320; seesTmp.height = 180; const seesTmpCtx = seesTmp.getContext('2d');
const stampEl = document.getElementById('stamp'); let stampT = 0;
function flash(t, secs = 0.6) { stampEl.textContent = t; stampEl.classList.add('on'); stampT = secs; }
const G = { diffBase: 0, ctl: 0, gateWas: false, pulse: 'none', pulseLeft: 0, elapsed: 0 };
function pulse(kind) { G.pulse = kind; G.pulseLeft = P.pulseSteps; }
const mDark = (c, r = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
let fishGltf = null;
function fishClone(len) {
  const o = fishGltf.scene.clone(true); const box = new THREE.Box3().setFromObject(o); const size = box.getSize(new THREE.Vector3()); const s = len / Math.max(size.x, size.y, size.z); o.scale.setScalar(s);
  box.setFromObject(o); const c = box.getCenter(new THREE.Vector3()); o.position.sub(c); o.traverse(m => { if (m.isMesh) { m.frustumCulled = false; m.castShadow = true; } });
  const g = new THREE.Group(); g.add(o); return g;
}

/* ============================ WORLD: TABLE TENNIS ============================ */
function TableTennis() {
  const TL = 2.74, TW = 1.525, TH = 0.76; const st = { vx: 0, vy: 0, vz: 0, serving: true, serveT: 0.8, returns: 0, misses: 0, nets: 0, rally: 0, best: 0, speed: 2.4, swing: 0, ptFish: 0, ptMachine: 0, gFish: 0, gMachine: 0, machX: 0, swingCd: 0, padTarget: 0, netHit: false, deadT: 0, hold: null };
  let ball, paddle, pad, ring, fPaddle, fishRig, machine, eye;
  return {
    name: 'table tennis', ctlTitle: 'Paddle · swing', gain: 0.7,
    foot: '<b>Table tennis.</b> A match: games to 11 against a ball machine that tracks slowly and has a 0.36 m reach, so an off-centre return can beat it. Right−left moves the paddle, the gate cells hold it forward, a point or a return is a reward, a miss is aversive. Physics runs at 240 Hz.' + COMMON_FOOT,
    build() {
      S.background = new THREE.Color(0x07080c); S.fog = new THREE.Fog(0x07080c, 8, 18); cam.position.set(0, 2.15, 3.6); cam.lookAt(0, 0.55, -0.25);
      S.add(new THREE.HemisphereLight(0x8fa3c8, 0x101014, 0.7)); const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 5, 2); sun.castShadow = true; S.add(sun);
      const lamp = new THREE.PointLight(0x3fd3f0, 8, 8, 1.8); lamp.position.set(0, 2.6, 0); S.add(lamp);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), mDark(0x141419, 0.95)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; S.add(floor);
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), mDark(0x0f1118, 1)); wall.position.set(0, 4, -6); S.add(wall);
      const table = new THREE.Mesh(new THREE.BoxGeometry(TW, 0.04, TL), mDark(0x0f3a3a, 0.6)); table.position.set(0, TH, 0); table.receiveShadow = true; table.castShadow = true; S.add(table);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xdfe6ee });
      for (const [w, d, x, z] of [[TW, 0.02, 0, TL / 2 - 0.01], [TW, 0.02, 0, -TL / 2 + 0.01], [0.02, TL, TW / 2 - 0.01, 0], [0.02, TL, -TW / 2 + 0.01, 0], [0.012, TL, 0, 0]]) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.005, d), lineMat); m.position.set(x, TH + 0.023, z); S.add(m); }
      const net = new THREE.Mesh(new THREE.BoxGeometry(TW + 0.3, 0.15, 0.01), new THREE.MeshStandardMaterial({ color: 0xb8c0cc, transparent: true, opacity: 0.55 })); net.position.set(0, TH + 0.095, 0); S.add(net);
      for (const [x, z] of [[-0.6, TL / 2 - 0.2], [0.6, TL / 2 - 0.2], [-0.6, -TL / 2 + 0.2], [0.6, -TL / 2 + 0.2]]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, TH, 0.06), mDark(0x1c1f28)); leg.position.set(x, TH / 2, z); S.add(leg); }
      machine = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mDark(0x23262f, 0.5)); machine.position.set(0, TH + 0.17, -TL / 2 - 0.2); S.add(machine);
      eye = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), new THREE.MeshBasicMaterial({ color: 0xc84cef })); eye.position.set(0, TH + 0.2, -TL / 2 - 0.045); S.add(eye);
      ball = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.9 })); ball.castShadow = true; S.add(ball); ball.add(new THREE.PointLight(0xffffff, 1.2, 1.2));
      paddle = new THREE.Group(); pad = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.012, 24), mDark(0xc8283c, 0.7)); pad.rotation.x = Math.PI / 2; pad.castShadow = true; paddle.add(pad);
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, 0.1, 10), mDark(0x9a7b4f)); grip.position.set(0, -0.13, 0); paddle.add(grip); paddle.position.set(0, TH + 0.16, TL / 2 + 0.12); S.add(paddle);
      ring = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 24), new THREE.MeshBasicMaterial({ color: 0x3fd3f0, transparent: true, opacity: 0.5, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.set(0, TH + 0.03, TL / 2 + 0.12); S.add(ring);
    },
    buildFish(FS) {
      fishRig = fishClone(1.7); fishRig.rotation.y = Math.PI * 0.85; FS.add(fishRig);
      fPaddle = paddle.clone(); fPaddle.scale.setScalar(2.2); fPaddle.position.set(0.85, -0.05, 0.25); fPaddle.rotation.set(0.2, -0.6, 0); FS.add(fPaddle);
      return { cam: [0.2, 0.7, 2.6], look: [0, 0.1, 0] };
    },
    hold(x) { st.hold = x; if (x == null) return; st.serving = false; ball.position.set(x, TH + 0.2, 0.6); st.vx = st.vy = st.vz = 0; },
    lob(toX, dirZ) { // aim a single bounce on the receiver's side, 0.5 m before the end line
      const bz = dirZ > 0 ? TL / 2 - 0.5 : -(TL / 2 - 0.5); const t = Math.abs(bz - ball.position.z) / st.speed; st.vz = dirZ * st.speed; st.vx = (toX - ball.position.x) / t; st.vy = (TH + 0.055 - ball.position.y + 4.9 * t * t) / t; },
    endPoint() { st.rally = 0; st.speed = 2.4; st.serving = true; st.serveT = 1.1; ball.position.set(0, -1, 0); if (st.ptFish >= 11 || st.ptMachine >= 11) { if (st.ptFish > st.ptMachine) { st.gFish++; flash('GAME · FISH', 1.5); } else { st.gMachine++; flash('GAME · MACHINE', 1.5); } st.ptFish = 0; st.ptMachine = 0; } },
    serve() { st.netHit = false; st.deadT = 0; ball.position.set((Math.random() - 0.5) * 0.4, TH + 0.3, -TL / 2 + 0.05); this.lob((Math.random() - 0.5) * (TW - 0.3), 1); st.serving = false; },
    step(dt) {

      else if (st.serving) { st.serveT -= dt; if (st.serveT <= 0) this.serve(); }

  hitCount = 0; for (let k = 0; k < vis.length; k++) { const [u, v] = B.uv[k]; const cx = Math.round(u * 319), cy = Math.round(v * 179); recPx[k * 2] = cx; recPx[k * 2 + 1] = cy; let lum = 0; for (let dy = -4; dy <= 4; dy += 2) for (let dx = -4; dx <= 4; dx += 2) { const x = Math.min(319, Math.max(0, cx + dx)), y = Math.min(179, Math.max(0, cy + dy)); const o = (y * 320 + x) * 4; lum = Math.max(lum, 0.2126 * lin(rtPix[o]) + 0.7152 * lin(rtPix[o + 1]) + 0.0722 * lin(rtPix[o + 2])); } drive[vis[k]] = P.inputGain * (lum - 0.5); recLum[k] = lum; if (lum > 0.32) hitCount++; }
  if (G.pulseLeft > 0 && G.pulse !== 'none') { for (const i of B.pops[G.pulse]) drive[i] += P.pulseAmp; G.pulseLeft--; if (!G.pulseLeft) G.pulse = 'none'; }
  brainStep(drive); const r = readout(); lastRead = r;
  if (B.steps <= 1) G.diffBase = r.diff; G.diffBase += (r.diff - G.diffBase) / (B.steps < 40 ? 10 : 240); G.ctl = r.diff - G.diffBase;
  const gateOpen = r.gate > P.gateLevel; W.act(G.ctl, gateOpen && !G.gateWas, gateOpen); G.gateWas = gateOpen;
  seesImg.data.set(rtPix); seesTmpCtx.putImageData(seesImg, 0, 0); seesCtx.save(); seesCtx.scale(1, -1); seesCtx.drawImage(seesTmp, 0, -seesC.height, seesC.width, seesC.height); seesCtx.restore();
  // receptor overlay: every light cell at its sample point; lit when its patch is bright
  for (let k = 0; k < 256; k++) { const x = recPx[k * 2] * seesC.width / 320, y = seesC.height - recPx[k * 2 + 1] * seesC.height / 180; const l = recLum[k]; const hit = l > 0.32;
    seesCtx.beginPath(); seesCtx.arc(x, y, hit ? 3.2 : 1.4, 0, 6.283); seesCtx.fillStyle = hit ? 'rgba(63,211,240,0.95)' : 'rgba(63,211,240,0.28)'; seesCtx.fill();
    if (hit) { seesCtx.beginPath(); seesCtx.arc(x, y, 6, 0, 6.283); seesCtx.strokeStyle = 'rgba(255,255,255,0.7)'; seesCtx.lineWidth = 1; seesCtx.stroke(); } }
  document.getElementById('hitN').textContent = hitCount;
  document.getElementById('rHit').textContent = hitCount; document.getElementById('rVis').textContent = groupMean(B.pops.visual, false).toFixed(2); document.getElementById('rL').textContent = r.left.toFixed(2) + 'σ'; document.getElementById('rR').textContent = r.right.toFixed(2) + 'σ'; document.getElementById('rG').textContent = r.gate.toFixed(2); document.getElementById('rE').textContent = B.changed;
  document.getElementById('ctl').textContent = `R−L ${G.ctl >= 0 ? '+' : ''}${G.ctl.toFixed(3)} · ${gateOpen ? 'GATE OPEN' : 'gate shut'}`;
  document.getElementById('needle').style.left = (50 + Math.max(-48, Math.min(48, G.ctl * 20))) + '%';
  updateBrainPoints();
}

/* ============================ LOOP ============================ */
const W = TASK === 'bike' ? Bike() : TASK === 'dog' ? Dog({ THREE, S, cam, G, pulse, flash, fishClone, mDark, COMMON_FOOT }) : TableTennis();
document.getElementById('foot').innerHTML = W.foot; document.getElementById('ctlTitle').textContent = W.ctlTitle; document.title = `ZEBRALINK — ${W.name}`;
function resize() {
  for (const [r, c, k] of [[R, glc, cam], [BR, bc, Bcam], [FR, fc, Fcam]]) { const w = c.clientWidth, h = c.clientHeight; if (!w || !h) continue; r.setSize(w, h, false); k.aspect = w / h; k.updateProjectionMatrix(); }
  if (bGroup) bGroup.rotation.z = bc.clientWidth < bc.clientHeight ? Math.PI / 2 : 0;
}
addEventListener('resize', resize);
const clock = new THREE.Clock(); let brainAcc = 0, ready = false;
function loop() {
  requestAnimationFrame(loop); const dt = Math.min(clock.getDelta(), 0.05); if (!ready) return;
  G.elapsed += dt; { const h = 1 / 240; let n = window.__nosub ? 1 : Math.max(1, Math.round(dt / h)); const hs = dt / n; for (let i = 0; i < n; i++) W.step(hs); }
  brainAcc += dt * P.stepHz; if (brainAcc >= 1) { brainTick(); brainAcc -= 1; }
  if (stampT > 0) { stampT -= dt; if (stampT <= 0) stampEl.classList.remove('on'); }
  document.getElementById('speed').textContent = W.speed(); document.getElementById('mode').textContent = W.mode(); document.getElementById('score').innerHTML = W.score() + `<br><span class="m">${G.pulse === 'reward' ? '● reward pulse' : G.pulse === 'aversive' ? '● aversive pulse' : '&nbsp;'}</span>`;
  const m = Math.floor(G.elapsed / 60), s = Math.floor(G.elapsed % 60); document.getElementById('clock').textContent = `${m}:${String(s).padStart(2, '0')}`; document.getElementById('elapsed').textContent = G.elapsed.toFixed(1) + 's elapsed';
  R.render(S, cam); if (bGroup) { bGroup.rotation.y += dt * 0.25; BR.render(BS, Bcam); } FR.render(FS, Fcam);
}
loop();
new GLTFLoader().load('assets/zebrafish.glb', g => {
  g.scene.traverse(m => { if (m.isMesh && m.material.map) { m.material.map.magFilter = THREE.NearestFilter; m.material.map.colorSpace = THREE.SRGBColorSpace; } });
  fishGltf = g;
  W.build(); const fv = W.buildFish(FS); Fcam.position.set(...fv.cam); Fcam.lookAt(...fv.look);
  loadBrain().then(loadBrainPoints).then(() => { document.getElementById('loading').classList.add('off'); resize(); ready = true; });
});
window.__ZEBRA = { get B() { return B; }, G, P, W, readout, get last() { return lastRead; } };
</script>
